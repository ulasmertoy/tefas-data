name: Gunluk TEFAS guncellemesi

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kac gunluk pencere cekilsin"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Veriyi cek
        uses: actions/checkout@v4

      - name: Kodu cek
        uses: actions/checkout@v4
        with:
          repository: ulasmertoy/tefas-assistant
          path: code

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Bagimliliklari kur
        run: pip install -r code/requirements.txt

      - name: Veriyi guncelle
        env:
          TEFAS_DATA_DIR: ${{ github.workspace }}/data
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python code/src/ingest.py --days ${{ inputs.days || '10' }}

      - name: Degisiklikleri commitle
        run: |
          git config user.name "tefas-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Veri degismedi - commit atlandi."
          else
            git commit -m "veri: $(date -u +%Y-%m-%d) guncellemesi"
            git push
          fi

      - name: Ozet
        if: always()
        run: |
          python - << 'PY'
          import pandas as pd, pathlib
          r = pathlib.Path("data/raw/funds_raw.parquet")
          p = pathlib.Path("data/processed/funds_features.parquet")
          out = []
          if r.exists():
              d = pd.read_parquet(r, columns=["date", "code"])
              d["date"] = pd.to_datetime(d["date"])
              out.append(f"Ham veri: {len(d):,} satir, {d['code'].nunique()} fon")
              out.append(f"Son tarih: {d['date'].max().date()}")
          if p.exists():
              out.append(f"Metrik tablosu: {len(pd.read_parquet(p))} fon")
          print("\n".join(out) or "Dosya bulunamadi.")
          PY
